services:
  # ------------------------------------------------------
  # 1. SIGNX Python FastAPI Backend Service
  # ------------------------------------------------------
  - type: web
    name: signx-backend
    runtime: python
    rootDir: backend
    plan: free
    branch: main
    buildCommand: pip install --upgrade pip && pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "*"

  # ------------------------------------------------------
  # 2. SIGNX React + Vite Frontend Static Site
  # ------------------------------------------------------
  - type: web
    name: signx-frontend
    runtime: static
    rootDir: frontend
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
